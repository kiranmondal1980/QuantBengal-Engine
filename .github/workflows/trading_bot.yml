name: QuantBengal Algo F&O Engine

on:
  schedule:
    # CRON Schedule: Runs every 15 minutes
    # Time is in UTC! Indian Standard Time (IST) is UTC + 5:30.
    # Market Open: 9:15 AM IST = 3:45 AM UTC
    # Market Close: 3:30 PM IST = 10:00 AM UTC
    # This CRON runs every 15 mins Monday-Friday between 3:45 AM and 10:00 AM UTC
    - cron: '*/15 3-10 * * 1-5'
  
  # This allows you to click a button in GitHub to run it manually anytime
  workflow_dispatch: 

jobs:
  run-algo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run QuantBengal Engine
        env:
          # Pulling secure keys from your GitHub Repository Secrets
          BROKER_API_KEY: ${{ secrets.BROKER_API_KEY }}
          BROKER_API_SECRET: ${{ secrets.BROKER_API_SECRET }}
          BROKER_ACCESS_TOKEN: ${{ secrets.BROKER_ACCESS_TOKEN }}
        run: |
          python main.py
