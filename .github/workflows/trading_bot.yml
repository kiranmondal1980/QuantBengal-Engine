name: QuantBengal Engine

on:
  schedule:
    # Every 15 min Mon-Fri, 03:30-10:00 UTC (09:00-15:30 IST)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Execution Category'
        required: true
        default: 'MOMENTUM'
        type: choice
        options:
          - MOMENTUM
          - IRON_CONDOR
          - BREAKOUT
      strategy_name:
        description: 'Specific Algorithm'
        required: true
        default: 'SuperTrend + RSI'
        type: choice
        options:
          - 'SuperTrend + RSI'
          - 'MACD + EMA Confluence'
          - 'Stochastic + BB Mean Reversion'
          - 'Triple EMA + Volume Trend'
          - 'Momentum Pulse (EMA+RSI)'
          - 'Bollinger Squeeze Breakout'
      index_choice:
        description: 'Index to trade'
        required: true
        default: 'NIFTY'
        type: choice
        options:
          - NIFTY
          - BANKNIFTY
          - SENSEX
      dry_run:
        description: 'Paper trade only (true/false)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      expiry_date:
        description: 'Options expiry (DDMMM format e.g. 30APR)'
        required: true
        default: '30APR'

permissions:
  contents: write

jobs:
  run-algo:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run QuantBengal Engine
        env:
          # ── Secrets (Security)
          BROKER_API_KEY:   ${{ secrets.BROKER_API_KEY }}
          CLIENT_ID:        ${{ secrets.CLIENT_ID }}
          PASSWORD:         ${{ secrets.PASSWORD }}
          TOTP_TOKEN:       ${{ secrets.TOTP_TOKEN }}

          # ── Strategy Config
          STRATEGY:         ${{ github.event.inputs.strategy      || vars.STRATEGY      || 'MOMENTUM' }}
          STRATEGY_NAME:    ${{ github.event.inputs.strategy_name || vars.STRATEGY_NAME || 'SuperTrend + RSI' }}
          INDEX_CHOICE:     ${{ github.event.inputs.index_choice  || vars.INDEX_CHOICE  || 'BANKNIFTY' }}
          EXPIRY_DATE:      ${{ github.event.inputs.expiry_date   || vars.EXPIRY_DATE   || '30APR' }}
          DRY_RUN:          ${{ github.event.inputs.dry_run       || 'true' }}

          # ── Risk & Capital Config
          CAPITAL:          ${{ vars.CAPITAL        || '20000' }}
          VIX:              ${{ vars.VIX            || '15.0' }}
          IC_EXPIRY:        ${{ vars.IC_EXPIRY      || '30APR' }}
          BANKNIFTY_SPOT:   ${{ vars.BANKNIFTY_SPOT || '0' }}

        run: python main.py

      - name: Create dummy log if missing
        run: touch engine.log

      - name: Upload engine log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-log-${{ github.run_number }}
          path: |
            *.log
            trade_ledger.csv
          retention-days: 30
